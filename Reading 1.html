<!DOCTYPE html>
<html>
<head>
    <!-- This title appears in the browser tab, not on the page itself -->
    <title>My Webpage Title</title>
</head>
<body>

    <!-- This is the main title/heading visible on the webpage -->
    <h1>Welcome to My Website</h1>

    <!-- This is a paragraph of text underneath the title -->
    <p>This is where you type your paragraph content. HTML automatically starts paragraphs on a new line and adds a little bit of spacing around them to make them easy to read.</p>

</body>
</html>
