<style>
img {
  border-radius: 8px;
  /* Names the animation, makes it last 2 seconds, and loops it infinitely */
  animation: bounce 2s infinite ease-in-out; 
}

/* Defines the bounce movement */
@keyframes bounce {
  0%, 100% {
    transform: translateY(0); /* Starts and ends at the normal position */
  }
  50% {
    transform: translateY(-20px); /* Moves up by 20 pixels at the halfway mark */
  }
}
</style>
