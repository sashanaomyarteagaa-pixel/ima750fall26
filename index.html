<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sasha Naomy Arteaga - Website</title>
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 17px;
            text-align: center;
        }

      
        #fullscreen-bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;     
            pointer-events: none; 
        }

        .main-content-layer {
            position: relative;
            z-index: 1;
            padding: 20px; 
        }

     
        .header-card {
            background-color: white; 
            padding: 20px 20px 10px 20px;
        }

      
        .buttons {        
            margin-top: 40px; 
        }

      
        .button {
            background-color: #FFFFFF;
            border: none;           
            border-radius: 8px;      
            color: black;
            padding: 16px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s; 
            margin: 5px;
        }

        .button: hover {
            background-color: #ddd;
        }

      
        .bouncing-video {
            display: block; 
            margin: 30px auto 0 auto;
            border-radius: 8px;
            animation: bounce 2s infinite ease-in-out; 
        }

        @keyframes bounce {
            0%, 100__ {
                transform: translateY(0); 
            }
            50% {
                transform: translateY(-20px); 
            }
        }
    </style>
</head>
<body>

    
    <video autoplay muted loop playsinline id="fullscreen-bg-video">
        <source src="Dancing625.mov" type="video/mp4">
    </video>

   
    <div class="main-content-layer">
        
       
        <header class="header-card">
            <h1 style="color: #7AA0FF; margin: 0;">Sasha Naomy Arteaga</h1>
            <h2 style="color: black; margin: 0; margin-top: 5px;">Writer- Creative- Skill Developer</h2>
        </header>

       
        <div class="buttons">        
            <a href="statement.html" class="button">Artist Statement</a>
            <a href="Blog.html" class="button">BLOG</a>
            <a href="Projects.html" class="button">IMA Projects</a>
            <a href="Past Work.html" class="button">Films</a>
            <a href="work.html" class="button">Work with me!</a>
        </div>

    
        <video autoplay loop muted playsinline class="bouncing-video" width="700" height="777">
            <source src="Dancing625.mov" type="video/mp4">
        </video>

    </div>

</body>
</html>
